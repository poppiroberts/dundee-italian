<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Italian Year Trainer</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#f3f4f6;color:#222;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.trainer{background:white;width:100%;max-width:460px;padding:25px;border-radius:18px;box-shadow:0 4px 25px #0001;text-align:center}h2{margin:0;font-size:25px}.subtitle{color:#777;font-size:14px;margin:8px 0 20px}.stats{display:flex;justify-content:space-between;font-size:13px;color:#666;border-bottom:1px solid #ddd;padding-bottom:12px}button{font:inherit;cursor:pointer;border:1px solid #ddd;border-radius:10px;background:white;color:#222;padding:12px 16px;font-weight:600}button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:default}.play{background:#17834c;color:white;border:0;width:100%;padding:18px;font-size:18px;margin:20px 0 15px}input[type=number]{width:100%;padding:15px;border:1px solid #ccc;border-radius:10px;font-size:32px;text-align:center;letter-spacing:5px;appearance:textfield;outline:none}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none}input[type=number]:focus{border-color:#17834c}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}#check{background:#222;color:white}.speed{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;margin-top:20px}input[type=range]{width:120px;accent-color:#17834c}#feedback{min-height:46px;margin-top:12px;padding:12px;font-size:14px;font-weight:600;border-radius:8px}.correct{background:#dcfce7;color:#15803d}.wrong{background:#fee2e2;color:#b91c1c}input.correct{border-color:#16a34a;background:#dcfce7}input.wrong{border-color:#dc2626;background:#fee2e2}
</style></head><body><main class="trainer"><h2>🇮🇹 Ascolta e scrivi</h2><div class="subtitle">Listen and identify the year · 1900–2026</div><div class="stats"><span id="round">Question 1</span><span id="score">Correct: 0 / 0</span></div><button class="play" id="play">▶ Listen to number</button><form id="answerForm"><input id="guess" type="number" placeholder="YYYY" inputmode="numeric" autocomplete="off" aria-label="Enter the year"><div class="actions"><button type="submit" id="check">Check answer</button><button type="button" id="next">Skip</button></div></form><div id="feedback" aria-live="polite">Press listen to begin.</div><div class="speed"><span>Speech speed</span><input id="speed" type="range" min="0.5" max="1.2" step="0.05" value="0.85" aria-label="Speech speed"><span id="speedLabel">0.85×</span></div></main>
<script>
const MIN_YEAR=1900, MAX_YEAR=2026;
let year=randomYear(),round=1,correct=0,total=0,finished=false,missed=false;
const el=id=>document.getElementById(id);
function randomYear(){return MIN_YEAR+Math.floor(Math.random()*(MAX_YEAR-MIN_YEAR+1));}
function say(){try{if(!('speechSynthesis' in window))throw new Error('Speech unavailable');window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(String(year));utterance.lang='it-IT';utterance.rate=Number(el('speed').value);utterance.pitch=1;utterance.volume=1;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==='it-it')||voices.find(v=>v.lang.toLowerCase().startsWith('it'));if(voice)utterance.voice=voice;utterance.onerror=e=>{if(['interrupted','canceled'].includes(e.error))return;el('feedback').className='';el('feedback').textContent='Audio unavailable. Check your browser’s Italian voice support.';};window.speechSynthesis.speak(utterance);}catch(e){el('feedback').className='';el('feedback').textContent='Speech playback is unavailable in this browser.';}}
function updateScore(){el('score').textContent=`Correct: ${correct} / ${total}`;}
function advance(){if(!finished){total++;updateScore();}const previous=year;do{year=randomYear();}while(year===previous&&MAX_YEAR>MIN_YEAR);round++;finished=false;missed=false;el('round').textContent='Question '+round;el('guess').value='';el('guess').className='';el('guess').disabled=false;el('check').disabled=false;el('next').textContent='Skip';el('feedback').className='';el('feedback').textContent='Listen and enter the year.';say();}
el('play').onclick=say;
el('answerForm').onsubmit=e=>{e.preventDefault();if(finished||!el('guess').value)return; if(Number(el('guess').value)===year){if(!missed)correct++;total++;finished=true;updateScore();el('feedback').className='correct';el('feedback').textContent='✓ Corretto! '+year;el('guess').className='correct';el('check').disabled=true;el('guess').disabled=true;el('next').textContent='Next number';}else{missed=true;el('feedback').className='wrong';el('feedback').textContent='✗ Riprova! — Try again.';el('guess').className='wrong';el('guess').focus();}};
el('guess').oninput=()=>el('guess').className='';el('next').onclick=advance;el('speed').oninput=()=>el('speedLabel').textContent=Number(el('speed').value).toFixed(2)+'×';
</script></body></html>
